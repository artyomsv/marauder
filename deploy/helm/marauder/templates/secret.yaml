{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "marauder.fullname" . }}-secrets
  labels:
    {{- include "marauder.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MARAUDER_MASTER_KEY MUST be a stable base64-encoded 32-byte key.
  # Generate with: openssl rand -base64 32
  {{ .Values.secrets.masterKeyName }}: {{ .Values.secrets.masterKey | quote }}
  {{ .Values.secrets.dbPasswordKey }}: {{ .Values.secrets.dbPassword | quote }}
  {{- if .Values.initialAdmin.password }}
  MARAUDER_ADMIN_INITIAL_PASSWORD: {{ .Values.initialAdmin.password | quote }}
  {{- end }}
{{- end }}
