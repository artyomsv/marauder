{{- if .Values.clients.transmission.enabled }}
{{- $c := .Values.clients.transmission }}
{{- include "marauder.pvc" (dict "name" "transmission-config" "spec" $c.config "root" $) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marauder.fullname" . }}-transmission
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "transmission") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "marauder.componentSelectorLabels" (dict "root" $ "component" "transmission") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "marauder.componentLabels" (dict "root" $ "component" "transmission") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "marauder.serviceAccountName" . }}
      containers:
        - name: transmission
          image: {{ printf "%s:%s" $c.image.repository $c.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Etc/UTC"
          ports:
            - name: http
              containerPort: {{ $c.webuiPort }}
          volumeMounts:
            {{- include "marauder.volumeMount" (dict "name" "transmission-config" "mountPath" "/config") | nindent 12 }}
            {{- include "marauder.volumeMount" (dict "name" "downloads" "mountPath" $c.downloadsMountPath) | nindent 12 }}
      volumes:
        {{- include "marauder.volume" (dict "name" "transmission-config" "spec" $c.config "root" $) | nindent 8 }}
        {{- include "marauder.volume" (dict "name" "downloads" "spec" .Values.persistence.downloads "root" $) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marauder.fullname" . }}-transmission
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "transmission") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "marauder.componentSelectorLabels" (dict "root" $ "component" "transmission") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.webuiPort }}
      targetPort: http
{{- end }}
