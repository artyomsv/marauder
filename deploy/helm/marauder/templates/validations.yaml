{{- /*
Fail-fast configuration validations. Emits no resources — only `fail`s with an
actionable message when a value combination would silently misbehave.
*/ -}}

{{- /* MARAUDER_MASTER_KEY is required and must be supplied at install time. */ -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.masterKey) }}
{{- fail "secrets.masterKey is required when secrets.create=true and secrets.existingSecret is unset. It encrypts tracker credentials and must stay stable. Generate one with `openssl rand -base64 32` and pass --set secrets.masterKey=..., or supply secrets.existingSecret." }}
{{- end }}

{{- /* dbPassword: an empty value crash-loops the simple tier and silently
       creates an unauthenticated CNPG cluster, so require it too. */ -}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.secrets.dbPassword) }}
{{- fail "secrets.dbPassword is required when secrets.create=true and secrets.existingSecret is unset. Generate one with `openssl rand -base64 24` and pass --set secrets.dbPassword=..., or supply secrets.existingSecret." }}
{{- end }}

{{- /* Reserved MARAUDER_* keys the chart sets itself (would duplicate a ConfigMap key). */ -}}
{{- $reserved := list "MARAUDER_HTTP_ADDR" "MARAUDER_CFSOLVER_ENABLED" "MARAUDER_CFSOLVER_URL" "MARAUDER_ADMIN_INITIAL_USERNAME" -}}
{{- range $k, $v := .Values.config }}
{{- if has $k $reserved }}
{{- fail (printf "config.%s is managed by the chart and must not be set in .Values.config (it would create a duplicate ConfigMap key). Remove it." $k) }}
{{- end }}
{{- end }}


{{- /* MARAUDER_FLARESOLVERR_URL is reserved only while the chart deploys the
       solver itself — that is when it manages the key. Rejecting the conflict
       rather than picking a winner is deliberate: an empty override would
       otherwise suppress the chart's value and leave the freshly deployed
       FlareSolverr wired to nothing, which is issue #158 arriving through the
       chart instead of through Compose. Supplying your own solver is still
       supported — turn the bundled one off. */ -}}
{{- if and .Values.arr.flaresolverr.enabled (hasKey (.Values.config | default dict) "MARAUDER_FLARESOLVERR_URL") }}
{{- fail "config.MARAUDER_FLARESOLVERR_URL is managed by the chart while arr.flaresolverr.enabled=true. To point Marauder at a solver you run yourself, set arr.flaresolverr.enabled=false and keep config.MARAUDER_FLARESOLVERR_URL; to use the bundled solver, remove config.MARAUDER_FLARESOLVERR_URL." }}
{{- end }}
{{- /* The downloads volume is shared with any bundled client/arr that mounts it. */ -}}
{{- $dl := .Values.persistence.downloads -}}
{{- $sharers := list -}}
{{- if .Values.clients.qbittorrent.enabled }}{{- $sharers = append $sharers "clients.qbittorrent" }}{{- end }}
{{- if .Values.clients.transmission.enabled }}{{- $sharers = append $sharers "clients.transmission" }}{{- end }}
{{- if .Values.arr.sonarr.enabled }}{{- $sharers = append $sharers "arr.sonarr" }}{{- end }}
{{- if gt (len $sharers) 0 }}
{{- if eq $dl.type "emptyDir" }}
{{- fail (printf "persistence.downloads.type=emptyDir is per-pod and NOT shared, but %s need to share it with the backend. Use existingClaim, an RWX pvc, nfs, hostPath or raw for downloads." (join ", " $sharers)) }}
{{- end }}
{{- if and (eq $dl.type "pvc") (not (has "ReadWriteMany" ($dl.pvc.accessModes | default list))) }}
{{- fail (printf "persistence.downloads is a ReadWriteOnce pvc but it is shared with %s. A shared downloads pvc must include ReadWriteMany in accessModes (use an RWX storageClass: NFS/CephFS/Longhorn-RWX), or disable the bundled clients/arr." (join ", " $sharers)) }}
{{- end }}
{{- end }}
