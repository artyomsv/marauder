apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marauder.fullname" . }}-backend
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "marauder.componentSelectorLabels" (dict "root" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marauder.componentLabels" (dict "root" $ "component" "backend") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "marauder.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "marauder.dbHost" . }} {{ .Values.database.port }}; do
                echo "waiting for {{ include "marauder.dbHost" . }}:{{ .Values.database.port }}…"; sleep 2;
              done
      containers:
        - name: backend
          image: {{ include "marauder.image" (dict "image" .Values.backendImage "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8679
          envFrom:
            - configMapRef:
                name: {{ include "marauder.fullname" . }}-config
          env:
            - name: MARAUDER_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "marauder.secretName" . }}
                  key: {{ .Values.secrets.masterKeyName }}
            # Password is passed via PGPASSWORD (libpq/pgx fallback) rather than
            # embedded in the DSN, so passwords with URL-special characters
            # (/, +, @, :, etc.) can't corrupt the connection string.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "marauder.secretName" . }}
                  key: {{ .Values.secrets.dbPasswordKey }}
            - name: MARAUDER_DB_URL
              value: "postgres://{{ .Values.database.user }}@{{ include "marauder.dbHost" . }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode={{ .Values.database.sslmode }}"
            - name: MARAUDER_ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "marauder.secretName" . }}
                  key: MARAUDER_ADMIN_INITIAL_PASSWORD
                  optional: true
          {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "marauder.volumeMount" (dict "name" "config" "mountPath" .Values.persistence.config.mountPath) | nindent 12 }}
            {{- include "marauder.volumeMount" (dict "name" "downloads" "mountPath" .Values.persistence.downloads.mountPath) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "marauder.volume" (dict "name" "config" "spec" .Values.persistence.config "root" $) | nindent 8 }}
        {{- include "marauder.volume" (dict "name" "downloads" "spec" .Values.persistence.downloads "root" $) | nindent 8 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marauder.fullname" . }}-backend
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "marauder.componentSelectorLabels" (dict "root" $ "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8679
      targetPort: http
