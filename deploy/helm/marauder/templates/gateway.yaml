{{/* Gateway nginx config — upstreams point at the chart's services. */}}
{{- define "marauder.gatewayConf" -}}
upstream marauder_backend {
    server {{ include "marauder.fullname" . }}-backend:8679;
}
upstream marauder_frontend {
    server {{ include "marauder.fullname" . }}-frontend:8081;
}
server {
    listen 6688;
    server_name _;
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location /api/v1/events {
        proxy_pass         http://marauder_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass         http://marauder_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health { proxy_pass http://marauder_backend/health; }
    location = /ready  { proxy_pass http://marauder_backend/ready;  }

    location / {
        proxy_pass         http://marauder_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marauder.fullname" . }}-gateway
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
data:
  default.conf: |
    {{- include "marauder.gatewayConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "marauder.fullname" . }}-gateway
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "marauder.componentSelectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marauder.componentLabels" (dict "root" $ "component" "gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ include "marauder.gatewayConf" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "marauder.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "marauder.image" (dict "image" .Values.gateway.image "root" $) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 6688
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "marauder.fullname" . }}-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "marauder.fullname" . }}-gateway
  labels:
    {{- include "marauder.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  {{- if and (eq .Values.gateway.service.type "LoadBalancer") .Values.gateway.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.gateway.service.loadBalancerIP }}
  {{- end }}
  selector:
    {{- include "marauder.componentSelectorLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
