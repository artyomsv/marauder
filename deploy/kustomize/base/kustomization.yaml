# Base: inflate the marauder Helm chart with its built-in default values
# (simple tier). The overlays (simple-db, cnpg) are the intended entry points.
#
# Build (Helm 3 recommended; Helm 4's `helm version` dropped the `-c` flag that
# kubectl's bundled kustomize probes with):
#   kubectl kustomize --enable-helm --load-restrictor LoadRestrictionsNone deploy/kustomize/base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmGlobals:
  chartHome: ../../helm

helmCharts:
  - name: marauder
    releaseName: marauder
    namespace: marauder
