# Development overlay for Marauder.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# What it does differently from the production stack:
#   - publishes the postgres, backend, and frontend ports directly to
#     the host so developers can hit them without going through nginx;
#   - starts qBittorrent and Transmission containers so tracker-to-client
#     integration tests can run end-to-end against real clients;
#   - starts Prowlarr + Sonarr + FlareSolverr so the Sonarr integration
#     (issue #86) can be exercised end-to-end. The backend reaches Sonarr at
#     http://sonarr:8989 on the shared network — set that URL in
#     Integrations → Sonarr (Prowlarr UI: http://localhost:34696,
#     Sonarr UI: http://localhost:34989).
#
# None of these services are exposed in production.
#
# All HOST-side ports stay in the 34xxx range per the local-port-ranges
# rule (host-exposed ports must be 30000-49999). Container-internal
# ports (right side of the mapping) keep their conventional values.

services:
  db:
    ports:
      - "${MARAUDER_DEV_DB_PORT:-34432}:5432"

  backend:
    ports:
      - "${MARAUDER_DEV_BACKEND_PORT:-34081}:8679"

  frontend:
    ports:
      - "${MARAUDER_DEV_FRONTEND_PORT:-34001}:8081"

  # Real qBittorrent for integration testing.
  # Web UI: http://localhost:34611 (default user "admin", password in
  # logs on first start).
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      WEBUI_PORT: "6611"
    volumes:
      - qbit_config:/config
      - ../.downloads/qbittorrent:/downloads
    ports:
      - "${MARAUDER_DEV_QBIT_PORT:-34611}:6611"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Real Transmission for integration testing.
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - transmission_config:/config
      - ../.downloads/transmission:/downloads
    ports:
      - "${MARAUDER_DEV_TRANSMISSION_PORT:-34091}:9091"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # --- *arr stack for the Sonarr integration (issue #86) ------------------
  # FlareSolverr lets Prowlarr through Cloudflare (RuTracker/Kinozal); it has
  # no host port — only Prowlarr talks to it (http://flaresolverr:8191).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    restart: unless-stopped
    environment:
      LOG_LEVEL: "info"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Prowlarr — indexer proxy. Web UI: http://localhost:34696.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:7ab5769616c1929247c8e7944453253f0b777fac2724c3bc9976ae2ff4023257
    restart: unless-stopped
    depends_on:
      - flaresolverr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - prowlarr_config:/config
    ports:
      - "${MARAUDER_DEV_PROWLARR_PORT:-34696}:9696"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Sonarr — series manager. Web UI: http://localhost:34989. The Marauder
  # backend reaches it at http://sonarr:8989 on the shared network.
  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:02bc962946fef994e67a38152446df25c10a52f8583aefeeb6467f9dd44cab99
    restart: unless-stopped
    depends_on:
      - prowlarr
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - sonarr_config:/config
      - ../.downloads:/data
    ports:
      - "${MARAUDER_DEV_SONARR_PORT:-34989}:8989"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  qbit_config:
  transmission_config:
  prowlarr_config:
  sonarr_config:
