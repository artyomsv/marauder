# Marauder gateway — fronts backend + frontend on a single host port.
#
# Exposed on 6688 to the host.

server {
    listen 6688;
    server_name _;

    # --- Upstreams, resolved per request (issue #244) ---
    # A static `upstream { server backend:8679; }` block is resolved ONCE, when
    # nginx starts. A backend or frontend container that is later recreated
    # (watchtower, `up -d` of one service, a crash restart) can come back on a
    # new IP, and the gateway kept proxying to the old one: every /api call
    # answered 502 while every container still reported healthy. A variable in
    # proxy_pass makes nginx resolve the name through Docker's embedded DNS
    # (127.0.0.11) at request time, cached for `valid`.
    # Docker only: 127.0.0.11 does not exist in Kubernetes, where the Helm chart
    # keeps static upstreams because a Service's ClusterIP does not change.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $marauder_backend  http://backend:8679;
    set $marauder_frontend http://frontend:8081;

    client_max_body_size 16m;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # --- SSE live event stream (no buffering, long-lived) ---
    location /api/v1/events {
        proxy_pass         $marauder_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # --- API ---
    location /api/ {
        proxy_pass         $marauder_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
        proxy_read_timeout 60s;
    }

    # --- Health / ready passthrough for external monitoring ---
    location = /health { proxy_pass $marauder_backend/health; }
    location = /ready  { proxy_pass $marauder_backend/ready;  }

    # --- Frontend (SPA) ---
    location / {
        proxy_pass         $marauder_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
