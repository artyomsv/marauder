# Marauder — prebuilt-image stack (no clone, no local build).
#
# This is the recommended way to RUN Marauder. It pulls the published,
# multi-arch, cosign-signed images from GitHub Container Registry instead
# of building them from source, so the only thing you need on the host is
# Docker. See docs/getting-started.md for the full guide.
#
# Quick start (from an empty directory, no git clone):
#
#   curl -fsSLO https://raw.githubusercontent.com/artyomsv/marauder/main/deploy/docker-compose.ghcr.yml
#   curl -fsSL  https://raw.githubusercontent.com/artyomsv/marauder/main/deploy/.env.example -o .env
#   sed -i "s|MARAUDER_MASTER_KEY=.*|MARAUDER_MASTER_KEY=$(openssl rand -base64 32)|" .env
#   docker compose -f docker-compose.ghcr.yml --env-file .env up -d
#
# Open: http://localhost:34080
#
# Requirements:
#   - Docker Compose v2.23.1+ (this file uses the `configs:` `content:`
#     short-hand to ship the gateway nginx config inline — no extra file
#     to download). Check with: docker compose version
#   - The GHCR packages must be public. If `docker compose pull` fails with
#     "denied" / 403, the maintainer has not flipped package visibility yet.
#
# Pin the version with MARAUDER_VERSION in .env (defaults to 1.0.1 below).
# `latest` also exists but floats with every release — pin for reproducible
# deployments.

name: marauder

services:
  db:
    # Pinned to an explicit patch + digest, NOT the floating 18-alpine tag,
    # so a postgres upgrade is always a deliberate, reviewable change.
    image: postgres:18.4-alpine@sha256:1b1689b20d16a014a3d195653381cf2caa75a41a92d93b255a9d6ea29fd353aa
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marauder}
      POSTGRES_USER: ${POSTGRES_USER:-marauder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marauder}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # PG18 hard-errors when a volume sits at the legacy
      # /var/lib/postgresql/data path (docker-library/postgres#1259).
      # Pin PGDATA there so the layout stays valid and the db boots.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - marauder_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marauder} -d ${POSTGRES_DB:-marauder}"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/artyomsv/marauder-backend:${MARAUDER_VERSION:-1.0.1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARAUDER_MASTER_KEY: ${MARAUDER_MASTER_KEY}
      MARAUDER_METRICS_TOKEN: ${MARAUDER_METRICS_TOKEN:-}
      MARAUDER_HTTP_ADDR: ":8679"
      MARAUDER_PUBLIC_BASE_URL: ${MARAUDER_PUBLIC_BASE_URL:-http://localhost:34080}
      MARAUDER_LOG_LEVEL: ${MARAUDER_LOG_LEVEL:-info}
      MARAUDER_LOG_JSON: ${MARAUDER_LOG_JSON:-true}
      MARAUDER_CORS_ORIGINS: ${MARAUDER_CORS_ORIGINS:-http://localhost:34080}
      MARAUDER_DB_URL: ${MARAUDER_DB_URL}
      MARAUDER_JWT_ISSUER: ${MARAUDER_JWT_ISSUER:-https://marauder.cc}
      MARAUDER_JWT_AUDIENCE: ${MARAUDER_JWT_AUDIENCE:-marauder-api}
      MARAUDER_ACCESS_TOKEN_TTL: ${MARAUDER_ACCESS_TOKEN_TTL:-15m}
      MARAUDER_REFRESH_TOKEN_TTL: ${MARAUDER_REFRESH_TOKEN_TTL:-720h}
      MARAUDER_SCHEDULER_ENABLED: ${MARAUDER_SCHEDULER_ENABLED:-true}
      MARAUDER_SCHEDULER_WORKERS: ${MARAUDER_SCHEDULER_WORKERS:-8}
      MARAUDER_SCHEDULER_MAX_EPISODES_PER_TICK: ${MARAUDER_SCHEDULER_MAX_EPISODES_PER_TICK:-25}
      MARAUDER_ADMIN_INITIAL_USERNAME: ${MARAUDER_ADMIN_INITIAL_USERNAME:-}
      MARAUDER_ADMIN_INITIAL_PASSWORD: ${MARAUDER_ADMIN_INITIAL_PASSWORD:-}
      MARAUDER_OIDC_ENABLED: ${MARAUDER_OIDC_ENABLED:-false}
      MARAUDER_OIDC_ISSUER: ${MARAUDER_OIDC_ISSUER:-}
      MARAUDER_OIDC_CLIENT_ID: ${MARAUDER_OIDC_CLIENT_ID:-}
      MARAUDER_OIDC_CLIENT_SECRET: ${MARAUDER_OIDC_CLIENT_SECRET:-}
      MARAUDER_OIDC_REDIRECT_URL: ${MARAUDER_OIDC_REDIRECT_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8679/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/artyomsv/marauder-frontend:${MARAUDER_VERSION:-1.0.1}
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only (`listen 8081;`),
      # but localhost resolves to ::1 first in this image -> false unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cfsolver:
    profiles: ["cfsolver"]
    image: ghcr.io/artyomsv/marauder-cfsolver:${MARAUDER_VERSION:-1.0.1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9244/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      # Host-side port stays in the 34xxx range (local-port-ranges rule).
      # Container-internal nginx still listens on 6688.
      - "${MARAUDER_HOST_PORT:-34080}:6688"
    configs:
      - source: gateway_conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only (`listen 6688;`),
      # but localhost resolves to ::1 first in this image -> false unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6688/"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# The gateway nginx config, shipped inline so the pull stack is a single
# downloadable file. This is a verbatim copy of deploy/nginx/gateway.conf
# with nginx's own `$` variables escaped as `$$` (Compose interpolates `$`
# inside `content:`, so `$host` would otherwise be eaten).
#
# >>> KEEP IN SYNC with deploy/nginx/gateway.conf <<<
configs:
  gateway_conf:
    content: |
      upstream marauder_backend {
          server backend:8679;
      }

      upstream marauder_frontend {
          server frontend:8081;
      }

      server {
          listen 6688;
          server_name _;

          client_max_body_size 16m;

          # --- Security headers ---
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

          # --- API ---
          location /api/ {
              proxy_pass         http://marauder_backend;
              proxy_http_version 1.1;
              proxy_set_header   Host              $$host;
              proxy_set_header   X-Real-IP         $$remote_addr;
              proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $$scheme;
              proxy_set_header   X-Request-ID      $$request_id;
              proxy_read_timeout 60s;
          }

          # --- Health / ready passthrough for external monitoring ---
          location = /health { proxy_pass http://marauder_backend/health; }
          location = /ready  { proxy_pass http://marauder_backend/ready;  }

          # --- Frontend (SPA) ---
          location / {
              proxy_pass         http://marauder_frontend;
              proxy_http_version 1.1;
              proxy_set_header   Host              $$host;
              proxy_set_header   X-Real-IP         $$remote_addr;
              proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Proto $$scheme;
          }
      }

volumes:
  marauder_pgdata:
