name: Docker build + scan

# Build all three Docker images on every push to master and on every tag.
# Trivy scans block on HIGH/CRITICAL vulnerabilities. This workflow does
# NOT push images — that's release.yml. Pull requests from forks do not
# run this workflow because Trivy needs registry access for the DB.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # for the SARIF upload step

jobs:
  build-scan:
    name: ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: ./backend
            tag: marauder-backend:ci
          - name: frontend
            context: ./frontend
            tag: marauder-frontend:ci
          - name: cfsolver
            context: ./cfsolver
            tag: marauder-cfsolver:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          push: false
          load: true
          tags: ${{ matrix.image.tag }}
          # cfsolver builds fresh: its chromium layer carries security patches
          # that a frozen GHA cache would mask, making the Trivy scan report
          # phantom CVEs from a stale layer that the shipped image doesn't have.
          no-cache: ${{ matrix.image.name == 'cfsolver' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.tag }}
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: HIGH,CRITICAL
          # Report-only: findings upload to the Security tab (SARIF step
          # below) but do not fail the build. The residual HIGH/CRITICAL
          # findings on a fully-patched image are Go-stdlib CVEs fixed only
          # in unreleased Go versions — an advisory treadmill no toolchain
          # bump can clear. Fixable module/OS CVEs are bumped promptly and
          # triaged from the Security tab.
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}
