name: CI

# The fast-feedback pipeline. Runs on every PR and on every push to main.
# Should finish in under 3 minutes for a typical change.
#
# Heavyweight things (full compose stack E2E, Trivy on built images,
# multi-arch Docker builds) live in their own workflows so they don't
# block contributors waiting on a typo fix.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight CI for the same ref/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Deliberately NOT a matrix. A job with a strategy.matrix has its matrix values appended to the
    # check name by GitHub — `name: Backend` plus `go: ['1.25']` reports as "Backend (1.25)", not
    # "Backend". This job is a required status check, so a name carrying the Go version deadlocks
    # every pull request the moment the version moves. A single-valued matrix bought nothing.
    env:
      GO_VERSION: '1.25'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Advisory, non-blocking: govulncheck tracks the upstream advisory DB,
      # which continuously outpaces released Go patches — current stdlib
      # advisories (net/http, crypto/tls, crypto/x509, os, net/url) are fixed
      # only in unreleased Go versions, so no toolchain bump can make this
      # green. We keep it running for visibility and fix every *actionable*
      # (module-level) vuln promptly; it must not block merges on
      # stdlib CVEs we cannot resolve.
      - name: govulncheck
        continue-on-error: true
        # Run govulncheck directly rather than via golang/govulncheck-action,
        # whose v1 (latest) internals still pin Node 20 actions
        # (checkout@v4.1.1, setup-go@v5.0.0) with no Node 24 release. This job
        # already checked out the repo and set up Go above, so the action's
        # internal setup was redundant anyway.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ---------------------------------------------------------------- backend lint
  backend-lint:
    name: Backend lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned for reproducible CI (the action's `latest` drifts the rule
          # set). v2.12.2 is built with Go 1.25 to match the toolchain; the
          # gosec G124/G710 false positives it adds are excluded in
          # .golangci.yml (see the documented reasons there).
          version: v2.12.2
          working-directory: backend
          args: --timeout=5m

  # -------------------------------------------------- backend integration
  # The repo layer's SQL semantics are invisible to its pgxmock unit tests:
  # those pin statement text and bound arguments but never execute anything,
  # so a JSONB key delete, a status CASE, or `IS NOT DISTINCT FROM` vs `=`
  # are asserted only by regex. These tests run the same statements against a
  # real Postgres with the real (embedded, goose) migrations applied.
  #
  # Its own job rather than a service container bolted onto `backend`, so the
  # fast-feedback job keeps starting instantly; this one runs in parallel and
  # a Postgres service container costs ~10s, so the under-3-minutes promise in
  # the header still holds. Scoped to internal/db/repo — the only package with
  # integration-tagged tests today.
  backend-integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marauder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: go mod download
        run: go mod download

      - name: go vet (integration tag)
        # The default `backend` job's vet does not see build-tagged files.
        run: go vet -tags=integration ./internal/db/repo/...

      - name: go test (integration)
        shell: bash
        env:
          MARAUDER_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/marauder_test?sslmode=disable
        # The suite skips itself when MARAUDER_TEST_DB_URL is unset, which is
        # what keeps a plain `go test ./...` working for contributors without a
        # database — but it also means a typo in the URL above would turn this
        # job green without running a single assertion. Fail on any skip.
        run: |
          go test -tags=integration -race -v ./internal/db/repo/... 2>&1 | tee "$RUNNER_TEMP/integration.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/integration.log"; then
            echo "::error::integration tests skipped - MARAUDER_TEST_DB_URL did not reach the Postgres service"
            exit 1
          fi

  # ---------------------------------------------------------------- cfsolver
  cfsolver:
    name: cfsolver build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cfsolver
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # cfsolver's go.mod requires Go 1.26 (chromedp v0.15.x pulls in
          # go-json-experiment, which needs 1.26). Keep in sync with
          # cfsolver/Dockerfile's golang builder tag.
          go-version: '1.26'
          cache: true
          cache-dependency-path: cfsolver/go.sum

      - name: go mod download
        run: go mod download

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # cfsolver is its own Go module, so the backend job's `go test ./...`
      # does not reach it — without this step its tests silently never run.
      - name: go test
        run: go test ./...

  # ------------------------------------------------------- release scripts
  # Unit-test the pure helper logic behind the auto-release pipeline
  # (Conventional Commit -> semver bump, next-version arithmetic, issue-ref
  # extraction, CHANGELOG rolling). Pure bash, no toolchain needed.
  release-scripts:
    name: Release helper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run release-helpers tests
        run: bash .github/scripts/release-helpers_test.sh

      - name: Run bump-version-refs tests
        run: bash .github/scripts/bump-version-refs_test.sh

      - name: Run verify-arch tests
        run: bash .github/scripts/verify-arch_test.sh

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Not a matrix, for the same reason as `backend` above: a matrix would put the Node version back
    # into the check name, and this job is a required status check.
    env:
      NODE_VERSION: '22'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: Bundle size summary
        run: |
          if [ -d dist/assets ]; then
            find dist/assets -maxdepth 1 -type f -printf '%s\t%p\n' | sort -rn
          fi
