name: E2E (full compose stack)

# The heavyweight end-to-end test. Brings up the full Marauder docker
# compose stack PLUS a real qBittorrent container, then runs the
# magnet -> qBittorrent walkthrough from docs/test-e2e-magnet.md.
#
# Runs nightly + on workflow_dispatch + on tag push (so a release is
# never tagged without a green E2E). NOT on every PR — that would be
# too slow and would burn shared minutes.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC nightly
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-walkthrough:
    name: docker compose -> magnet -> qBittorrent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate .env
        working-directory: deploy
        run: |
          cp .env.example .env
          MASTER=$(openssl rand -base64 32)
          METRICS=$(openssl rand -hex 32)
          sed -i "s|MARAUDER_MASTER_KEY=.*|MARAUDER_MASTER_KEY=${MASTER}|" .env
          sed -i "s|MARAUDER_METRICS_TOKEN=.*|MARAUDER_METRICS_TOKEN=${METRICS}|" .env

      - name: Bring up the dev stack (with qBittorrent)
        working-directory: deploy
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            up -d --build

      - name: Wait for backend health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:34080/health >/dev/null; then
              echo "backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml logs backend
          exit 1

      - name: Wait for qBittorrent and grab the temporary password
        id: qbit
        run: |
          for _ in $(seq 1 60); do
            PW=$(docker logs deploy-qbittorrent-1 2>&1 | grep "temporary password" | awk '{print $NF}' | tail -1 || true)
            if [ -n "$PW" ]; then
              echo "qBit temporary password acquired"
              echo "password=$PW" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "qBit never produced a temporary password"
          docker logs deploy-qbittorrent-1
          exit 1

      - name: Run the magnet -> qBittorrent walkthrough
        env:
          QBIT_PASSWORD: ${{ steps.qbit.outputs.password }}
        run: |
          set -e

          echo "[1] login to Marauder"
          LOGIN=$(curl -sS -X POST http://localhost:34080/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"pleasechangeme"}')
          TOK=$(echo "$LOGIN" | awk -F'"access_token":"' '{print $2}' | awk -F'"' '{print $1}')
          test -n "$TOK"

          echo "[2] create qBittorrent client"
          CLIENT_JSON=$(curl -sS -X POST http://localhost:34080/api/v1/clients \
            -H "Authorization: Bearer $TOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"client_name\": \"qbittorrent\",
              \"display_name\": \"E2E qBit\",
              \"is_default\": true,
              \"config\": {
                \"url\": \"http://qbittorrent:6611\",
                \"username\": \"admin\",
                \"password\": \"${QBIT_PASSWORD}\"
              }
            }")
          echo "$CLIENT_JSON"
          CLIENT_ID=$(echo "$CLIENT_JSON" | awk -F'"id":"' '{print $2}' | awk -F'"' '{print $1}')
          test -n "$CLIENT_ID"

          echo "[3] add magnet topic"
          INFOHASH=0123456789abcdef0123456789abcdef01234567
          MAG="magnet:?xt=urn:btih:${INFOHASH}&dn=marauder-e2e"
          TOPIC_JSON=$(curl -sS -X POST http://localhost:34080/api/v1/topics \
            -H "Authorization: Bearer $TOK" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$MAG\",\"client_id\":\"$CLIENT_ID\"}")
          echo "$TOPIC_JSON"
          TOPIC_ID=$(echo "$TOPIC_JSON" | awk -F'"ID":"' '{print $2}' | awk -F'"' '{print $1}')
          test -n "$TOPIC_ID"

          echo "[4] wait for the scheduler to push the torrent (up to ~135s)"
          # Verify through Marauder's own API, which exercises the real
          # backend -> qBittorrent delivery path and records topic_deliveries.
          # We deliberately do NOT poke the qBittorrent WebUI directly:
          # qBittorrent 5.x rejects requests whose Host-header port differs
          # from its WebUI port, which the published host port (34611 -> 6611)
          # does, so a host-side login returns 401.
          sleep 75
          echo "[5] verify delivery via Marauder topic status API"
          for _ in $(seq 1 6); do
            STATUS=$(curl -sS -H "Authorization: Bearer $TOK" \
              "http://localhost:34080/api/v1/topics/$TOPIC_ID/status")
            echo "$STATUS"
            if echo "$STATUS" | grep -q "$INFOHASH"; then
              echo "delivery recorded for $INFOHASH"
              exit 0
            fi
            sleep 10
          done
          echo "torrent $INFOHASH never appeared in topic status"
          exit 1

      - name: Print stack logs on failure
        if: failure()
        working-directory: deploy
        run: |
          echo "::group::container status"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps -a
          echo "::endgroup::"
          # db first: a depends_on:service_healthy failure aborts the
          # whole `up`, and the db is the usual culprit — but its logs
          # were never dumped, which hid postgres#1259 for 60 runs.
          for svc in db backend frontend gateway; do
            echo "::group::$svc logs"
            docker compose -f docker-compose.yml -f docker-compose.dev.yml logs "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
