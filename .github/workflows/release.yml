name: Release

# Release pipeline. Triggered by a v* tag push.
#
# What it does:
#   1. Re-runs CI on the tagged commit (paranoia)
#   2. Builds backend, frontend, cfsolver as multi-arch images
#      (linux/amd64, linux/arm64) and pushes to ghcr.io
#   3. Signs each image with cosign (keyless via OIDC)
#   4. Generates a CycloneDX SBOM per image with anchore/sbom-action
#   5. Creates a GitHub Release with the matching CHANGELOG section

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true

permissions:
  contents: write       # to create the GitHub Release
  packages: write       # to push to GHCR
  id-token: write       # for cosign keyless signing
  attestations: write   # for build provenance

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ------------------------------------------------------------------ build
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    outputs:
      backend-digest: ${{ steps.export.outputs.backend-digest }}
      frontend-digest: ${{ steps.export.outputs.frontend-digest }}
      cfsolver-digest: ${{ steps.export.outputs.cfsolver-digest }}
    strategy:
      # Don't let one image's arch-verify failure cancel the others' builds —
      # each image is independent and we want all results in one run.
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: ./backend
            binpath: /usr/local/bin/marauder
          - name: frontend
            context: ./frontend
            binpath: ''            # nginx static assets, no Go binary to arch-check
          - name: cfsolver
            context: ./cfsolver
            binpath: /usr/local/bin/cfsolver
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Compute build date
        id: bm
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp version metadata into the binary. The backend Dockerfile
          # consumes these; frontend/cfsolver ignore unused build args.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.bm.outputs.date }}
          provenance: true
          sbom: true
          # cfsolver builds fresh so each release ships a chromium with the
          # latest security patches rather than a frozen GHA cache layer that
          # would silently go stale over weeks between releases.
          no-cache: ${{ matrix.image.name == 'cfsolver' }}
          cache-from: type=gha,scope=release-${{ matrix.image.name }}
          cache-to: type=gha,scope=release-${{ matrix.image.name }},mode=max

      # Verify every published platform contains a binary of the matching
      # architecture (issue #74: the arm64 manifest shipped an amd64 binary
      # that died with "exec format error" on real aarch64 hosts). We extract
      # the binary from each platform image WITHOUT running it and check its
      # ELF machine type — because executing it here would NOT catch the bug:
      # this runner is amd64, so an amd64 binary in an arm64 image runs
      # natively (the host CPU can execute it) and never raises a format error.
      # The arch mismatch only surfaces on a true aarch64 host, so the reliable
      # CI signal is the binary's declared arch vs. the manifest's platform.
      # QEMU (set up above) additionally lets us exec each binary as a bonus
      # liveness check; the arch assertion is the actual gate.
      - name: Verify each platform's binary architecture (QEMU)
        if: matrix.image.binpath != ''
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}@${{ steps.push.outputs.digest }}
          BIN: ${{ matrix.image.binpath }}
        run: |
          set -euo pipefail
          fail=0
          for arch in amd64 arm64; do
            echo "== linux/$arch =="
            # `docker create` resolves the per-platform image but does NOT run
            # the binary, so the check is independent of the runner's own arch.
            cid="$(docker create --platform "linux/$arch" "$IMG")"
            docker cp "$cid:$BIN" "./bin-$arch"
            docker rm "$cid" >/dev/null
            # The ELF-arch match decision lives in a unit-tested script
            # (.github/scripts/verify-arch.sh, covered by verify-arch_test.sh).
            bash .github/scripts/verify-arch.sh assert-file "./bin-$arch" "$arch" || fail=1
            # Bonus liveness check: run the binary under its platform. On this
            # amd64 runner the arm64 binary executes via QEMU. We don't require
            # a clean exit (no --help; exits on missing config) — only that the
            # kernel doesn't reject it outright.
            out="$(timeout 30 docker run --rm --platform "linux/$arch" "$IMG" 2>&1 || true)"
            if printf '%s' "$out" | grep -q 'exec format error'; then
              echo "::error::marauder-${{ matrix.image.name }} on linux/$arch failed to exec (exec format error)"
              fail=1
            fi
            # Drop the digest-pinned image before the next platform. Docker keeps
            # a single local record per digest, so a second `docker create
            # --platform` of the SAME digest fails with "cannot overwrite digest"
            # — which blocked the v1.1.3 release on the arm64 iteration. Removing
            # it forces a clean per-platform pull each time.
            docker rmi -f "$IMG" >/dev/null 2>&1 || true
          done
          [ "$fail" -eq 0 ]

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMG"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.image.name }}.cdx.json
          output-file: sbom-${{ matrix.image.name }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image.name }}
          path: sbom-${{ matrix.image.name }}.cdx.json

      - name: Export digest
        id: export
        run: echo "${{ matrix.image.name }}-digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------- github release
  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the annotated tag object (carrying the PR
          # description from auto-release.yml) is available to read locally.
          fetch-depth: 0

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: sboms
          pattern: sbom-*

      - name: Extract changelog section for this tag
        id: changelog
        env:
          # Pass the workflow_dispatch input via env rather than interpolating
          # ${{ }} straight into the shell, so the value can never be parsed as
          # script (defense-in-depth; only write-access actors can dispatch).
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME:-$TAG_INPUT}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Pull the [VER] block out of CHANGELOG.md, stopping at the next ## heading.
          # Match the heading by literal prefix (index), not a regex — the
          # version is bracketed (e.g. "## [1.0.2]") and "[1.0.2]" in a regex
          # is a character class, which never matches the real heading.
          awk -v v="## [$VER]" '
            index($0, v) == 1 {flag=1; next}
            /^## / && flag {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VER, falling back to a generic note." >&2
            echo "Marauder $TAG. See CHANGELOG.md for details." > release-notes.md
          fi

          # Append the merged PR's description, carried in the annotated tag
          # message by auto-release.yml. Everything except the machine-readable
          # "Issues:"/"PR:" trailer lines is the PR title + body. A manually
          # pushed tag or a workflow_dispatch run has no annotation, so this
          # adds nothing and the behavior is unchanged.
          PRDESC="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null \
            | sed -E '/^(Issues|PR):[[:space:]]/d')"
          if [ -n "$(printf '%s' "$PRDESC" | tr -d '[:space:]')" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "## Pull Request"
              echo ""
              printf '%s\n' "$PRDESC"
            } >> release-notes.md
          fi

      # Create/publish the release with notes ONLY — no asset uploads in this
      # gating step. GitHub's release-asset API intermittently 404s on
      # upload/metadata-update (eventual consistency); when that failed the
      # combined step, the whole `release` job failed and the version-sync +
      # issue-notify jobs (needs: [release]) were silently SKIPPED — which froze
      # README and the marketing site at the previous version release after
      # release. Keeping asset attachment out of the gating step makes the
      # release reliable and the downstream sync run every time.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Marauder ${{ steps.changelog.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.tag, '-rc') || contains(steps.changelog.outputs.tag, '-alpha') || contains(steps.changelog.outputs.tag, '-beta') }}

      # Attach the SBOMs best-effort. `gh release upload --clobber` is idempotent
      # (safe to re-run) and avoids the action's delete-then-reupload path that
      # triggers the asset-API 404s. continue-on-error: a supply-chain-artifact
      # hiccup must never fail the release or block the version sync below.
      - name: Attach SBOMs (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t sboms < <(find sboms -type f -name '*.cdx.json')
          if [ "${#sboms[@]}" -eq 0 ]; then
            echo "::warning::No SBOMs found to attach."
            exit 0
          fi
          gh release upload "$TAG" "${sboms[@]}" --clobber --repo "$REPO"

  # --------------------------------------------------- notify linked issues
  # Comment on every issue the released PR was linked to (closing keywords in
  # the PR body and/or an issue-number branch prefix), telling the reporter the
  # fix/feature shipped and how to test it. Issue numbers are read from the
  # "Issues:" trailer in the annotated tag message that auto-release.yml wrote.
  # Runs only AFTER the release is published, so the linked tag/images exist.
  notify-issues:
    name: Notify linked issues
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Comment on linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # Parse "Issues: #a #b" from the annotated tag message.
          ISSUES="$(git tag -l --format='%(contents)' "$TAG" \
            | sed -nE 's/^Issues:[[:space:]]*//p' \
            | grep -oE '[0-9]+' || true)"

          if [ -z "$ISSUES" ]; then
            echo "No linked issues in tag $TAG — nothing to notify."
            exit 0
          fi

          REL_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # Build the comment body in a file (avoids flush-left heredocs that
          # would break the YAML block scalar). printf keeps every line indented
          # as run-block content while emitting unindented markdown.
          {
            printf ':rocket: **Released in [%s](%s).**\n\n' "$TAG" "$REL_URL"
            printf 'This shipped in Marauder %s. Test it by pulling the prebuilt images:\n\n' "$TAG"
            printf '```\n'
            printf 'ghcr.io/%s/marauder-backend:%s\n'  "$OWNER" "$VER"
            printf 'ghcr.io/%s/marauder-frontend:%s\n' "$OWNER" "$VER"
            printf 'ghcr.io/%s/marauder-cfsolver:%s\n' "$OWNER" "$VER"
            printf '```\n\n'
            printf 'or set `MARAUDER_VERSION=%s` in your `deploy/.env` and re-pull the GHCR stack.\n\n' "$VER"
            printf 'Please give it a try and let us know if it resolves the problem — thanks for the report! :pray:\n'
          } > issue-comment.md

          for n in $ISSUES; do
            echo "Commenting on issue #$n"
            gh issue comment "$n" --repo "$REPO" --body-file issue-comment.md \
              || echo "::warning::Failed to comment on issue #$n (non-fatal)."
          done

  # -------------------------------------------- sync version references
  # Stamp the released version into every file that mirrors it, so the source
  # build, the prebuilt ghcr stack, the example env, and the marketing site all
  # report the real released version instead of hand-maintained markers. The
  # actual edits live in .github/scripts/bump-version-refs.sh (tested by
  # bump-version-refs_test.sh).
  bump-dev-version:
    name: Sync version references
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Push as the owner (RELEASE_PAT) so these direct-to-main commits
          # clear the branch ruleset's "require a pull request" rule — the
          # default GITHUB_TOKEN (github-actions[bot]) is not a bypass actor and
          # would be rejected. Falls back to GITHUB_TOKEN if the PAT is unset
          # (works only if the ruleset is absent/relaxed).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Stamp released version and commit
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"

          bash .github/scripts/bump-version-refs.sh "$VER"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Deploy/repo artifacts (incl. README version markers): nothing to
          # redeploy -> [skip ci]. README.md MUST be in this add list — the
          # bump script edits its release badge / latest-release marker /
          # MARAUDER_VERSION default, but those edits are dropped if the file is
          # never staged (which froze README at an old version for many releases).
          if ! git diff --quiet -- deploy/docker-compose.yml deploy/docker-compose.ghcr.yml deploy/.env.example README.md; then
            git add deploy/docker-compose.yml deploy/docker-compose.ghcr.yml deploy/.env.example README.md
            git commit -m "chore: pin deploy stack and README to ${VER} [skip ci]"
          else
            echo "deploy/README version references already at ${VER}"
          fi

          # Site content: must trigger site.yml to redeploy marauder.cc, so this
          # commit deliberately does NOT carry [skip ci]. It is committed LAST so
          # it is the push HEAD (GitHub evaluates [skip ci] on the head commit).
          if ! git diff --quiet -- site/src/data/seo.ts site/src/pages/install.astro; then
            git add site/src/data/seo.ts site/src/pages/install.astro
            git commit -m "chore(site): set displayed version to ${VER}"
          else
            echo "site version references already at ${VER}"
          fi

          # Pushes any commits made above (no-op if both were already current).
          git push origin main
