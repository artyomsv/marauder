name: Release

# Release pipeline. Triggered by a v* tag push.
#
# What it does:
#   1. Re-runs CI on the tagged commit (paranoia)
#   2. Builds backend, frontend, cfsolver as multi-arch images
#      (linux/amd64, linux/arm64) and pushes to ghcr.io
#   3. Signs each image with cosign (keyless via OIDC)
#   4. Generates a CycloneDX SBOM per image with anchore/sbom-action
#   5. Creates a GitHub Release with the matching CHANGELOG section

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true

permissions:
  contents: write       # to create the GitHub Release
  packages: write       # to push to GHCR
  id-token: write       # for cosign keyless signing
  attestations: write   # for build provenance

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ------------------------------------------------------------------ build
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    outputs:
      backend-digest: ${{ steps.export.outputs.backend-digest }}
      frontend-digest: ${{ steps.export.outputs.frontend-digest }}
      cfsolver-digest: ${{ steps.export.outputs.cfsolver-digest }}
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: cfsolver
            context: ./cfsolver
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Compute build date
        id: bm
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp version metadata into the binary. The backend Dockerfile
          # consumes these; frontend/cfsolver ignore unused build args.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.bm.outputs.date }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image.name }}
          cache-to: type=gha,scope=release-${{ matrix.image.name }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless)
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMG"

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/marauder-${{ matrix.image.name }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.image.name }}.cdx.json
          output-file: sbom-${{ matrix.image.name }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image.name }}
          path: sbom-${{ matrix.image.name }}.cdx.json

      - name: Export digest
        id: export
        run: echo "${{ matrix.image.name }}-digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------- github release
  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history + tags so the annotated tag object (carrying the PR
          # description from auto-release.yml) is available to read locally.
          fetch-depth: 0

      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          path: sboms
          pattern: sbom-*

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Pull the [VER] block out of CHANGELOG.md, stopping at the next ## heading.
          # Match the heading by literal prefix (index), not a regex — the
          # version is bracketed (e.g. "## [1.0.2]") and "[1.0.2]" in a regex
          # is a character class, which never matches the real heading.
          awk -v v="## [$VER]" '
            index($0, v) == 1 {flag=1; next}
            /^## / && flag {flag=0}
            flag {print}
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VER, falling back to a generic note." >&2
            echo "Marauder $TAG. See CHANGELOG.md for details." > release-notes.md
          fi

          # Append the merged PR's description, carried in the annotated tag
          # message by auto-release.yml. Everything except the machine-readable
          # "Issues:"/"PR:" trailer lines is the PR title + body. A manually
          # pushed tag or a workflow_dispatch run has no annotation, so this
          # adds nothing and the behavior is unchanged.
          PRDESC="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null \
            | sed -E '/^(Issues|PR):[[:space:]]/d')"
          if [ -n "$(printf '%s' "$PRDESC" | tr -d '[:space:]')" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "## Pull Request"
              echo ""
              printf '%s\n' "$PRDESC"
            } >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Marauder ${{ steps.changelog.outputs.tag }}
          body_path: release-notes.md
          files: sboms/**/*.cdx.json
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.tag, '-rc') || contains(steps.changelog.outputs.tag, '-alpha') || contains(steps.changelog.outputs.tag, '-beta') }}

  # --------------------------------------------------- notify linked issues
  # Comment on every issue the released PR was linked to (closing keywords in
  # the PR body and/or an issue-number branch prefix), telling the reporter the
  # fix/feature shipped and how to test it. Issue numbers are read from the
  # "Issues:" trailer in the annotated tag message that auto-release.yml wrote.
  # Runs only AFTER the release is published, so the linked tag/images exist.
  notify-issues:
    name: Notify linked issues
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Comment on linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"

          # Parse "Issues: #a #b" from the annotated tag message.
          ISSUES="$(git tag -l --format='%(contents)' "$TAG" \
            | sed -nE 's/^Issues:[[:space:]]*//p' \
            | grep -oE '[0-9]+' || true)"

          if [ -z "$ISSUES" ]; then
            echo "No linked issues in tag $TAG — nothing to notify."
            exit 0
          fi

          REL_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          # Build the comment body in a file (avoids flush-left heredocs that
          # would break the YAML block scalar). printf keeps every line indented
          # as run-block content while emitting unindented markdown.
          {
            printf ':rocket: **Released in [%s](%s).**\n\n' "$TAG" "$REL_URL"
            printf 'This shipped in Marauder %s. Test it by pulling the prebuilt images:\n\n' "$TAG"
            printf '```\n'
            printf 'ghcr.io/%s/marauder-backend:%s\n'  "$OWNER" "$VER"
            printf 'ghcr.io/%s/marauder-frontend:%s\n' "$OWNER" "$VER"
            printf 'ghcr.io/%s/marauder-cfsolver:%s\n' "$OWNER" "$VER"
            printf '```\n\n'
            printf 'or set `MARAUDER_VERSION=%s` in your `deploy/.env` and re-pull the GHCR stack.\n\n' "$VER"
            printf 'Please give it a try and let us know if it resolves the problem — thanks for the report! :pray:\n'
          } > issue-comment.md

          for n in $ISSUES; do
            echo "Commenting on issue #$n"
            gh issue comment "$n" --repo "$REPO" --body-file issue-comment.md \
              || echo "::warning::Failed to comment on issue #$n (non-fatal)."
          done

  # ----------------------------------------------- bump source-build version
  # Keep the source-build (dev) stack's stamped version in sync with the
  # latest release, so a local `docker compose up --build` reports the real
  # released version instead of a hand-maintained marker. Commits the bump
  # back to main with [skip ci] so it doesn't re-trigger CI.
  bump-dev-version:
    name: Bump dev stack version
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set dev stack version to the released version
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"

          # Update the source-build VERSION build arg and the marauder-* image
          # tags in the base compose file. Other images (postgres, nginx) are
          # left untouched by the marauder- prefix anchor.
          sed -i -E "s|(VERSION: \")[^\"]+(\")|\1${VER}\2|" deploy/docker-compose.yml
          sed -i -E "s#(image: marauder-(backend|frontend|cfsolver):).*#\1${VER}#" deploy/docker-compose.yml

          if git diff --quiet -- deploy/docker-compose.yml; then
            echo "deploy/docker-compose.yml already at ${VER}, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/docker-compose.yml
          git commit -m "chore: set dev stack version to ${VER} [skip ci]"
          git push origin main
